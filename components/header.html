<!-- components/header.html -->
<!-- Stable Header v7.1: old working structure + Documents menu -->
<div
  id="mobileOverlay"
  class="fixed inset-0 z-40 hidden bg-slate-900/50 opacity-0 backdrop-blur-sm transition-opacity duration-300 dark:bg-black/60 md:hidden"
></div>

<aside
  id="sidebar"
  class="transition-theme fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full transform flex-col border-r border-slate-800 bg-brand-900 text-slate-300 shadow-xl transition-transform duration-300 ease-in-out md:relative md:translate-x-0"
>
  <div
    class="flex items-center justify-between border-b border-slate-800 bg-slate-900/50 p-6"
  >
    <div class="flex items-center gap-3">
      <div
        class="transition-theme flex h-10 w-10 items-center justify-center rounded-lg bg-brand-600 text-white shadow-sm dark:bg-sky-600"
      >
        <i class="fa-solid fa-building text-xl"></i>
      </div>
      <div>
        <h1
          class="whitespace-nowrap text-base font-bold tracking-wide text-white"
        >
          ระบบบริหารจัดการ
        </h1>
        <p class="text-[10px] leading-tight text-brand-100/70">
          สารสนเทศและสื่อสารองค์กร
        </p>
      </div>
    </div>

    <button
      id="closeSidebarBtn"
      class="flex h-8 w-8 items-center justify-center rounded-md text-slate-400 hover:bg-slate-800 hover:text-white md:hidden"
      type="button"
    >
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-6">
    <div
      class="mb-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500"
    >
      เมนูหลัก
    </div>

    <nav class="space-y-1.5" id="sidebarNav">
      <a
        href="dashboard.html"
        data-page="dashboard"
        class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <i class="fa-solid fa-table-cells-large text-lg"></i>
        <span>ภาพรวม (Dashboard)</span>
      </a>

      <a
        href="leave.html"
        data-page="leave"
        class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <i class="fa-regular fa-calendar text-lg"></i>
        <span>ระบบจัดการวันลา</span>
      </a>

      <a
        href="projects.html"
        data-page="projects"
        class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <i class="fa-solid fa-chart-line text-lg"></i>
        <span>โครงการและงบประมาณ</span>
      </a>

      <a
        href="meeting.html"
        data-page="meeting"
        class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span>ระบบจองห้องประชุม</span>
      </a>

      <a
        href="documents.html"
        data-page="documents"
        class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
      >
        <i class="fa-solid fa-folder text-lg"></i>
        <span>จัดเก็บเอกสาร</span>
      </a>
    </nav>

    <div id="adminMenu" class="mt-8 hidden">
      <div
        class="mb-3 text-[11px] font-semibold uppercase tracking-wider text-slate-500"
      >
        ผู้ดูแลระบบ
      </div>
      <nav class="space-y-1.5">
        <a
          href="admin.html"
          data-page="admin"
          class="nav-item flex items-center gap-3 rounded-lg px-4 py-3 text-slate-400 transition-colors hover:bg-slate-800 hover:text-white"
        >
          <i class="fa-solid fa-users-gear text-lg"></i>
          <span>จัดการผู้ใช้งานและสิทธิ์</span>
        </a>
      </nav>
    </div>
  </div>

  <div class="border-t border-slate-800 bg-slate-900/80 p-6">
    <div class="mb-4 flex items-center gap-3">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-700 bg-slate-800 text-slate-300"
      >
        <i class="fa-regular fa-user text-xl"></i>
      </div>
      <div class="overflow-hidden">
        <div id="userName" class="truncate text-sm font-medium text-white">
          กำลังโหลด...
        </div>
        <div
          id="userRole"
          class="truncate text-[11px] text-brand-400 dark:text-sky-400"
        >
          ...
        </div>
      </div>
    </div>

    <button
      id="logoutBtn"
      class="flex w-full items-center justify-center gap-2 rounded-lg border border-red-500/30 px-4 py-2.5 text-sm text-red-400 transition-colors hover:bg-red-500 hover:text-white"
      type="button"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>ออกจากระบบ</span>
    </button>
  </div>
</aside>

<main
  class="transition-theme flex min-w-0 flex-1 flex-col bg-slate-50 dark:bg-slate-900"
>
  <header
    class="transition-theme sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200 bg-white px-6 shadow-sm dark:border-slate-700 dark:bg-slate-800 lg:px-8"
  >
    <div class="flex items-center gap-4">
      <button
        id="mobileMenuBtn"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-slate-100 text-slate-600 transition-colors hover:bg-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-300 md:hidden"
        type="button"
      >
        <i class="fa-solid fa-bars text-xl"></i>
      </button>

      <div>
        <h2
          id="pageTitle"
          class="transition-theme text-xl font-bold text-slate-800 dark:text-white md:text-2xl"
        >
          ภาพรวมระบบ
        </h2>
        <p
          id="pageSubtitle"
          class="transition-theme hidden text-sm text-slate-500 dark:text-slate-400 sm:block"
        >
          ข้อมูลสรุปการทำงานและสถานะปัจจุบัน
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button
        id="themeToggleBtn"
        class="theme-toggle-btn flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-slate-600 transition-colors hover:bg-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-yellow-400 dark:hover:bg-slate-600"
        type="button"
      >
        <i
          class="theme-toggle-icon sun-icon fa-solid fa-sun text-xl"
        ></i>
        <i
          class="theme-toggle-icon moon-icon fa-solid fa-moon text-xl"
        ></i>
      </button>

      <button
        class="relative flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-600 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 dark:hover:text-sky-400"
        type="button"
      >
        <i class="fa-regular fa-bell text-lg"></i>
        <span
          class="absolute right-2.5 top-2.5 h-2 w-2 rounded-full border border-white bg-red-500 dark:border-slate-800"
        ></span>
      </button>
    </div>
  </header>

  <div
    class="z-10 flex-1 overflow-y-auto p-6 lg:p-8"
    id="pageContent"
  ></div>
</main>
