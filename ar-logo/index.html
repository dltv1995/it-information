<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AR Logo Auto Scanner</title>
  <link rel="stylesheet" href="./css/style.css?v=14">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="sceneHost"></div>
  <section id="startScreen" class="start-screen">
    <div class="card">
      <div class="brand">AR</div>
      <p class="gold-text">DLTV INTERACTIVE</p>
      <h1 id="startTitle">กำลังเปิดกล้อง</h1>
      <p id="startMessage">กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง</p>
      <div id="spinner" class="spinner"></div>
      <div class="mind-status"><span>ฐานข้อมูลภาพ</span><strong id="mindStatus">กำลังตรวจสอบ...</strong></div>
      <button id="startButton" class="button hidden" type="button">แตะเพื่อเปิดกล้อง</button>
    </div>
  </section>
  <section id="scannerUi" class="scanner-ui hidden">
    <div class="scanner-header"><div class="mini-brand">AR</div><div><small>ระบบสแกนอัตโนมัติ</small><strong>ส่องโลโก้หน่วยงาน</strong></div></div>
    <div id="statusText" class="status">กำลังค้นหาโลโก้...</div>
    <div id="scanFrame" class="frame"><i></i><i></i><i></i><i></i><span></span></div>
    <div class="instruction">นำกล้องเข้าใกล้โลโก้ให้เห็นรายละเอียดชัดเจน</div>
  </section>
  <section id="errorPanel" class="error hidden"><strong>เริ่มระบบไม่สำเร็จ</strong><p id="errorText"></p><button id="retryButton" class="button" type="button">ลองอีกครั้ง</button></section>
  <script src="./js/config.js?v=14"></script>
  <script src="./js/scanner.js?v=14"></script>
</body>
</html>
