<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>AR Logo Scanner</title>
  <link rel="stylesheet" href="./css/style.css?v=8">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <section id="startScreen" class="screen start-screen">
    <div class="panel start-panel">
      <div class="badge">AR</div>
      <h1>ระบบสแกนโลโก้</h1>
      <p>เลือกหน่วยงาน แล้วเปิดกล้องส่องโลโก้</p>
      <div id="agencyList" class="agency-list"></div>
      <button id="startButton" class="button gold wide" type="button" disabled>เลือกหน่วยงานก่อน</button>
      <small>แต่ละหน่วยงานใช้ไฟล์ .mind แยกกัน แก้ไขรายการได้ที่ js/config.js</small>
    </div>
  </section>

  <section id="scannerUi" class="scanner-ui hidden" aria-live="polite">
    <div class="top-bar">
      <button id="changeAgencyButton" class="mini-button" type="button">‹ เปลี่ยนหน่วยงาน</button>
      <div id="activeAgencyName" class="active-agency"></div>
    </div>
    <div id="statusText" class="status-pill">กำลังเปิดกล้อง...</div>
    <div id="scanBox" class="scan-box"><i></i><i></i><i></i><i></i><span></span></div>
    <div class="scan-help">วางโลโก้ให้อยู่ภายในกรอบ</div>
  </section>

  <section id="resultModal" class="result-modal hidden" role="dialog" aria-modal="true">
    <div class="result-card">
      <button id="closeTop" class="close-button" type="button">×</button>
      <div class="found-icon">✓</div>
      <div class="eyebrow">ตรวจพบโลโก้แล้ว</div>
      <h2 id="agencyTitle"></h2>
      <p id="agencyDescription"></p>
      <div class="actions">
        <button id="openDriveButton" class="button gold wide" type="button">เปิดรับชมวิดีโอ</button>
        <button id="scanAgainButton" class="button dark wide" type="button">ปิดและสแกนต่อ</button>
      </div>
    </div>
  </section>

  <section id="errorPanel" class="error-panel hidden" role="alert">
    <strong>เริ่มระบบไม่สำเร็จ</strong><p id="errorText"></p>
    <button id="retryButton" class="button gold" type="button">ลองอีกครั้ง</button>
  </section>

  <a-scene id="arScene"
    mindar-image="imageTargetSrc: ./mind/targets.mind; autoStart: false; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 4; missTolerance: 8; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="singleTarget" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script src="./js/config.js?v=8"></script>
  <script src="./js/scanner.js?v=8"></script>
</body>
</html>
