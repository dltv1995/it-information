<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./css/style.css?v=9"><title>เลือกหน่วยงาน AR</title></head><body><main class="page"><section class="card"><div class="badge">AR</div><h1>ระบบสแกนโลโก้</h1><p>เลือกหน่วยงานที่ต้องการสแกน</p><div id="list" class="grid"></div></section></main><script src="./js/config.js?v=9"></script><script>AR_AGENCIES.forEach((a,i)=>{const b=document.createElement('button');b.className='agency';b.innerHTML=`<img src="${a.logo}" onerror="this.style.display='none'"><span>${a.title}</span>`;b.onclick=()=>location.href=`scan.html?agency=${i}`;list.appendChild(b)});</script></body></html>
