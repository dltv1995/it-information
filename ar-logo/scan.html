<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>AR Scanner</title><link rel="stylesheet" href="./css/style.css?v=10"><script src="./js/config.js?v=10"></script><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script></head>
<body class="scan-body"><div id="sceneHost" class="scene-host"></div>
<section id="startScreen" class="camera-start"><div class="camera-card"><div class="brand small"><span>AR</span></div><p class="kicker">พร้อมสแกน</p><h1 id="selectedName">กำลังเตรียมระบบ</h1><p id="mindFileText" class="mind-file"></p><button id="openCamera" class="btn btn-gold" type="button">เปิดกล้องเต็มหน้าจอ</button><button id="backStart" class="btn btn-ghost" type="button">เปลี่ยนหน่วยงาน</button></div></section>
<section id="scannerUi" class="scanner-ui hidden" aria-live="polite"><header class="scanner-header"><button id="changeAgency" class="round-btn" type="button" aria-label="ย้อนกลับ">‹</button><div class="scanner-title"><small>กำลังสแกน</small><strong id="activeAgency"></strong></div></header><div id="statusText" class="status-pill">กำลังเปิดกล้อง...</div><div id="scanFrame" class="scan-frame"><i></i><i></i><i></i><i></i><span></span><div class="center-dot"></div></div><div class="scan-instruction">นำกล้องเข้าใกล้โลโก้ให้เห็นรายละเอียดชัดเจน</div></section>
<section id="resultModal" class="result-modal hidden"><div class="result-sheet"><button id="closeResult" class="close-btn" type="button">×</button><div class="success">✓</div><p class="kicker">ตรวจพบโลโก้แล้ว</p><h2 id="resultTitle"></h2><p id="resultDescription"></p><button id="openDrive" class="btn btn-gold" type="button">เปิดรับชมวิดีโอ</button><button id="scanAgain" class="btn btn-ghost" type="button">ปิดและสแกนต่อ</button></div></section>
<section id="errorPanel" class="error-panel hidden"><strong>เปิดระบบไม่สำเร็จ</strong><p id="errorText"></p><button id="retry" class="btn btn-gold" type="button">ลองอีกครั้ง</button></section>
<script src="./js/scan.js?v=10"></script></body></html>
