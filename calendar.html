<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>ปฏิทินกิจกรรม</title>

  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { brand: { 50: "#f0f9ff", 100: "#e0f2fe", 400: "#38bdf8", 600: "#0284c7", 900: "#0f172a" } },
          fontFamily: { sans: ["Noto Sans Thai", "sans-serif"] }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/calendar.css?v=calendar-ui-v2">
</head>
<body id="appBody" class="hidden bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
  data-title="ปฏิทินกิจกรรม" data-subtitle="จัดการและติดตามกิจกรรมทั้งหมด" data-active-menu="calendar">
  <div id="layoutRoot" class="min-h-screen md:h-screen flex overflow-hidden"></div>

  <template id="calendarPageTemplate">
    <section class="calendar-page max-w-[1650px] mx-auto w-full">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div>
          <h3 class="text-lg font-bold">ภาพรวมกิจกรรม</h3>
          <p class="text-sm text-slate-500 dark:text-slate-400">ดูหมายกำหนดการและกิจกรรมขององค์กรในที่เดียว</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="manageCategoriesBtn" type="button" class="btn-secondary"><i class="fa-solid fa-tags"></i> จัดการหัวข้อ</button>
          <button id="addEventBtn" type="button" class="btn-primary"><i class="fa-solid fa-plus"></i> เพิ่มกิจกรรม</button>
        </div>
      </div>

      <div class="calendar-layout grid grid-cols-[minmax(0,1fr)_330px] gap-5 items-start">
        <div class="calendar-card rounded-2xl overflow-hidden min-w-0">
          <div class="calendar-toolbar">
            <div class="flex items-center gap-2">
              <button id="todayBtn" type="button" class="toolbar-btn px-4">วันนี้</button>
              <button id="prevMonthBtn" type="button" class="toolbar-btn w-10" aria-label="เดือนก่อนหน้า"><i class="fa-solid fa-chevron-left"></i></button>
              <button id="nextMonthBtn" type="button" class="toolbar-btn w-10" aria-label="เดือนถัดไป"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <h4 id="calendarMonthTitle" class="calendar-toolbar-title text-lg font-bold text-center"></h4>
            <button id="mobileFilterBtn" type="button" class="toolbar-btn xl:hidden px-4"><i class="fa-solid fa-filter"></i> ตัวกรอง</button>
          </div>
          <div class="p-3 lg:p-4 overflow-x-auto"><div class="min-w-[700px]"><div id="calendarGrid" class="calendar-grid rounded-xl overflow-hidden"></div></div></div>
          <div id="calendarLegend" class="calendar-legend"></div>
        </div>

        <aside id="filterDrawer" class="filter-drawer space-y-4">
          <div class="calendar-side-card rounded-2xl p-5">
            <div class="flex items-center justify-between gap-3 mb-4">
              <h4 class="font-bold">ตัวกรอง</h4>
              <div class="flex items-center gap-3">
                <button id="clearFiltersBtn" type="button" class="text-link">ล้างตัวกรอง</button>
                <button id="closeFilterBtn" type="button" class="xl:hidden icon-btn"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <label class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="eventSearch" type="search" placeholder="ค้นหาหัวข้อ รายละเอียด สถานที่..."></label>
            <div class="flex items-center justify-between mb-3">
              <h5 class="text-sm font-bold">ประเภทกิจกรรม</h5>
              <button id="selectAllBtn" type="button" class="text-link">เลือกทั้งหมด</button>
            </div>
            <div id="categoryFilters" class="space-y-3"></div>
            <div class="mt-6">
              <h5 class="text-sm font-bold mb-3">สถานะ</h5>
              <select id="statusFilter" class="form-control"><option value="all">ทั้งหมด</option><option value="confirmed">ยืนยันแล้ว</option><option value="pending">รอดำเนินการ</option><option value="cancelled">ยกเลิก</option></select>
            </div>
          </div>
          <div class="calendar-side-card rounded-2xl p-5">
            <div class="flex items-center justify-between mb-4"><h4 class="font-bold">กิจกรรมที่กำลังจะมาถึง</h4><span id="resultCount" class="text-link"></span></div>
            <div id="upcomingList" class="space-y-3"></div>
          </div>
        </aside>
      </div>
    </section>

    <div id="mobileFilterBackdrop" class="mobile-filter-backdrop"></div>

    <div id="categoryModal" class="modal" hidden>
      <div class="modal-card max-w-xl">
        <div class="modal-header"><div><h4 class="modal-title">จัดการหัวข้อตัวกรอง</h4><p class="modal-subtitle">เพิ่มหรือลบประเภทกิจกรรมแบบจำลอง</p></div><button type="button" class="icon-btn" data-close-modal="categoryModal"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="modal-body">
          <form id="categoryForm" class="category-create-row">
            <input id="newCategoryName" class="form-control" maxlength="50" required placeholder="เช่น ประชุมคณะกรรมการ">
            <input id="newCategoryColor" class="color-input" type="color" value="#0ea5e9" title="เลือกสี">
            <button class="btn-primary whitespace-nowrap" type="submit"><i class="fa-solid fa-plus"></i> เพิ่มหัวข้อ</button>
          </form>
          <p id="categoryError" class="form-error" hidden></p>
          <div id="categoryManageList" class="category-manage-list"></div>
          <p class="helper-text"><i class="fa-solid fa-circle-info"></i> หัวข้อที่มีกิจกรรมอยู่จะลบได้ โดยกิจกรรมของหัวข้อนั้นจะถูกลบพร้อมกันในรุ่นจำลองนี้</p>
        </div>
      </div>
    </div>

    <div id="eventFormModal" class="modal" hidden>
      <div class="modal-card max-w-2xl">
        <div class="modal-header"><div><h4 class="modal-title">เพิ่มกิจกรรม</h4><p class="modal-subtitle">กรอกข้อมูลตัวอย่างก่อนเชื่อมฐานข้อมูล</p></div><button type="button" class="icon-btn" data-close-modal="eventFormModal"><i class="fa-solid fa-xmark"></i></button></div>
        <form id="eventForm">
          <div class="modal-body form-grid">
            <label class="form-field form-span-2"><span>หัวข้อกิจกรรม <b>*</b></span><input id="eventTitle" class="form-control" maxlength="100" required placeholder="เช่น ประชุมติดตามโครงการระบบ HR"></label>
            <label class="form-field"><span>วันที่ <b>*</b></span><input id="eventDate" class="form-control" type="date" required></label>
            <label class="form-field"><span>ประเภทกิจกรรม <b>*</b></span><select id="eventCategory" class="form-control" required></select></label>
            <label class="form-field"><span>เวลาเริ่ม <b>*</b></span><input id="eventStartTime" class="form-control" type="time" required></label>
            <label class="form-field"><span>เวลาสิ้นสุด <b>*</b></span><input id="eventEndTime" class="form-control" type="time" required></label>
            <label class="form-field form-span-2"><span>สถานที่</span><input id="eventLocation" class="form-control" maxlength="100" placeholder="เช่น ห้องประชุม 2 ชั้น 3"></label>
            <label class="form-field form-span-2"><span>รายละเอียด</span><textarea id="eventDescription" class="form-control min-h-24" maxlength="500" placeholder="รายละเอียดหรือวาระกิจกรรม"></textarea></label>
            <label class="form-field"><span>สถานะ</span><select id="eventStatus" class="form-control"><option value="confirmed">ยืนยันแล้ว</option><option value="pending">รอดำเนินการ</option><option value="cancelled">ยกเลิก</option></select></label>
            <div class="form-field"><span>ตัวอย่างข้อมูล</span><button id="fillSampleBtn" type="button" class="btn-secondary w-full justify-center"><i class="fa-solid fa-wand-magic-sparkles"></i> เติมข้อมูลตัวอย่าง</button></div>
            <p id="eventFormError" class="form-error form-span-2" hidden></p>
          </div>
          <div class="modal-footer"><button type="button" class="btn-secondary" data-close-modal="eventFormModal">ยกเลิก</button><button type="submit" class="btn-primary"><i class="fa-regular fa-floppy-disk"></i> บันทึกกิจกรรมจำลอง</button></div>
        </form>
      </div>
    </div>

    <div id="eventDetailModal" class="modal" hidden>
      <div class="modal-card max-w-lg">
        <div class="modal-header"><div><h4 id="detailTitle" class="modal-title"></h4><p id="detailCategory" class="modal-subtitle"></p></div><button type="button" class="icon-btn" data-close-modal="eventDetailModal"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="modal-body detail-list">
          <p><i class="fa-regular fa-calendar"></i><span id="detailDate"></span></p>
          <p><i class="fa-regular fa-clock"></i><span id="detailTime"></span></p>
          <p><i class="fa-solid fa-location-dot"></i><span id="detailLocation"></span></p>
          <p><i class="fa-solid fa-circle-info"></i><span id="detailStatus"></span></p>
          <div id="detailDescription" class="detail-description"></div>
        </div>
        <div class="modal-footer"><button id="deleteEventBtn" type="button" class="btn-danger"><i class="fa-regular fa-trash-can"></i> ลบกิจกรรม</button><button type="button" class="btn-secondary" data-close-modal="eventDetailModal">ปิด</button></div>
      </div>
    </div>

    <div id="confirmModal" class="modal modal-top" hidden>
      <div class="modal-card max-w-sm">
        <div class="modal-body text-center py-7"><div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><h4 id="confirmTitle" class="modal-title mt-4"></h4><p id="confirmMessage" class="text-sm text-slate-500 dark:text-slate-400 mt-2"></p></div>
        <div class="modal-footer justify-center"><button id="cancelConfirmBtn" type="button" class="btn-secondary">ไม่ลบ</button><button id="acceptConfirmBtn" type="button" class="btn-danger">ยืนยันลบ</button></div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
  </template>

  <script type="module" src="assets/js/header.js"></script>
  <script src="assets/js/calendar.js?v=calendar-ui-v2"></script>
</body>
</html>
