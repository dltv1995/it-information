<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AR Logo Auto Scanner</title>

  <link rel="stylesheet" href="./css/style.css?v=13">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <div id="sceneHost"></div>

  <section id="startScreen" class="start-screen">
    <div class="start-card">
      <div class="brand">AR</div>
      <p class="eyebrow">DLTV INTERACTIVE</p>
      <h1>สแกนโลโก้หน่วยงาน</h1>
      <p class="lead">
        ระบบจะตรวจจับอัตโนมัติว่าเป็นโลโก้ของหน่วยงานใด
      </p>

      <div class="file-status">
        <span>ฐานข้อมูลภาพ</span>
        <strong id="mindStatus">กำลังตรวจสอบ...</strong>
      </div>

      <button id="startButton" class="button button-gold" type="button" disabled>
        กำลังเตรียมระบบ
      </button>
    </div>
  </section>

  <section id="scannerUi" class="scanner-ui hidden" aria-live="polite">
    <header class="scanner-header">
      <div class="scanner-brand">AR</div>
      <div>
        <small>ระบบสแกนอัตโนมัติ</small>
        <strong>ส่องโลโก้ใดก็ได้</strong>
      </div>
    </header>

    <div id="statusText" class="status-pill">
      กำลังเปิดกล้อง...
    </div>

    <div id="scanFrame" class="scan-frame">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <span></span>
      <div class="center-dot"></div>
    </div>

    <div class="instruction">
      นำกล้องเข้าใกล้โลโก้ให้เห็นรายละเอียดชัดเจน
    </div>
  </section>

  <section id="resultModal" class="result-modal hidden">
    <div class="result-sheet">
      <button id="closeResult" class="close-button" type="button">×</button>
      <div class="success-icon">✓</div>
      <p class="eyebrow">ตรวจพบโลโก้แล้ว</p>
      <h2 id="resultTitle"></h2>
      <p id="resultDescription"></p>

      <button id="openLinkButton" class="button button-gold" type="button">
        เปิดรับชมวิดีโอ
      </button>

      <button id="scanAgainButton" class="button button-dark" type="button">
        ปิดและสแกนต่อ
      </button>
    </div>
  </section>

  <section id="errorPanel" class="error-panel hidden" role="alert">
    <strong>เริ่มระบบไม่สำเร็จ</strong>
    <p id="errorText"></p>
    <button id="retryButton" class="button button-gold" type="button">
      ลองอีกครั้ง
    </button>
  </section>

  <script src="./js/config.js?v=13"></script>
  <script src="./js/scanner.js?v=13"></script>
</body>
</html>
